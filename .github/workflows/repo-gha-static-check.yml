name: GHA static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions-lock:
    name: Verify Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/actions/setup-toolchain
        with:
          setup-aqua: "true"

      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  gha-static-check:
    uses: $/.github/workflows/gha-static-check.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    with:
      actionlint-self-action-path: "$/actions/setup-toolchain"

  release-please:
    name: Release Please
    needs: [actions-lock, gha-static-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/repo-release-please.yml
    permissions:
      contents: read
      pull-requests: write
