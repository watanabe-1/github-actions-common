name: autofix.ci

on:
  workflow_call:
    inputs:
      fix-command:
        description: Shell command to run before autofix.ci captures changes. Use a reviewed literal command from the caller workflow; do not pass event data.
        required: false
        type: string
        default: bun run check:fix
      bun-install-mode:
        description: Bun install mode. Use auto for existing behavior, frozen for --frozen-lockfile, update to refresh bun.lock, or skip to avoid installing.
        required: false
        type: string
        default: auto

permissions: {}

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for autofix-ci/action to push fixes
      pull-requests: write # needed for autofix-ci/action to update the pull request
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/actions/setup-toolchain
        with:
          setup-aqua: "true"
          bun-version: aqua
          bun-cache: "true"

      - name: Fix aqua-checksums.json
        run: aqua upc -prune

      - name: Install dependencies
        shell: bash
        env:
          BUN_INSTALL_MODE: ${{ inputs.bun-install-mode }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$BUN_INSTALL_MODE" in
            skip)
              exit 0
              ;;
            frozen)
              bun install --frozen-lockfile
              ;;
            update)
              bun install
              ;;
            auto)
              if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
                bun install
              else
                bun install --frozen-lockfile
              fi
              ;;
            *)
              echo "Invalid bun-install-mode: $BUN_INSTALL_MODE" >&2
              echo "Allowed values are: auto, frozen, update, skip" >&2
              exit 1
              ;;
          esac

      - name: Run fix command
        if: inputs.fix-command != ''
        shell: bash
        env:
          FIX_COMMAND: ${{ inputs.fix-command }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$FIX_COMMAND"

      - name: Run autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
