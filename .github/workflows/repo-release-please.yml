name: Release Please

on:
  workflow_call:
    secrets:
      RENOVATE_APP_ID:
        required: true
      RENOVATE_PRIVATE_KEY:
        required: true

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'watanabe-1/github-actions-common' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: renovate
    permissions:
      contents: read
      pull-requests: write # The Actions bot approves PRs authored by the separate GitHub App.
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write # Release tags can target commits with different workflow files.
          permission-pull-requests: write
          permission-issues: write

      - name: Create or publish release
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Find the app-authored Release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        run: |
          set -euo pipefail
          # The search index can lag behind PR creation. Read the PR list API directly.
          # Query unchanged PRs too, so reruns can retry approval and auto-merge.
          candidates="$(gh api --method GET "repos/${GH_REPO}/pulls" \
            -f state=open -f base=main \
            -f head="${GH_REPO%%/*}:release-please--branches--main--components--github-actions-common" \
            -f per_page=100 --paginate \
            --jq '.[] | [.number, .head.sha, .user.login, ([.labels[].name] | index("autorelease: pending") != null)] | @tsv')"
          number=''
          sha=''
          while IFS=$'\t' read -r candidate_number candidate_sha author pending; do
            if [[ "$author" == "$APP_BOT" && "$pending" == true ]]; then
              if [[ -n "$number" ]]; then
                echo '::error::Multiple matching Release PRs found.'
                exit 1
              fi
              number="$candidate_number"
              sha="$candidate_sha"
            fi
          done <<< "$candidates"
          if [[ -z "$number" && "$PRS_CREATED" == true ]]; then
            echo '::error::Release Please created a PR, but it could not be found for approval.'
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Approve the Release PR
        if: steps.release-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.release-pr.outputs.number }}
        run: gh pr review "$PR_NUMBER" --approve

      - name: Enable GitHub auto-merge
        if: steps.release-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          PR_SHA: ${{ steps.release-pr.outputs.sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_SHA"

      - name: Update moving major tag
        if: ${{ steps.release.outputs.release_created }}
        shell: bash
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          tag="v${MAJOR}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${RELEASE_SHA}" \
              -F force=true
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${RELEASE_SHA}"
          fi
